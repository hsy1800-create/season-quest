<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>계절 탐사대 현황판</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="firebase-config.js"></script>
<script src="live.js"></script>
<script src="missions.js"></script>
<style>
  main { max-width: 1280px; }
  .room-code { font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: .14em; color: var(--sun); }

  .entry { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 760px) { .entry { grid-template-columns: 1fr; } }
  .big-code { font-family: var(--display); font-weight: 700; font-size: clamp(56px, 10vw, 110px); letter-spacing: .12em; line-height: 1; color: var(--ink); }
  .join { display: grid; grid-template-columns: auto 1fr; gap: 20px; align-items: center; }
  @media (max-width: 640px) { .join { grid-template-columns: 1fr; } }
  .qr { background: #fff; padding: 10px; border-radius: 12px; border: 2px solid var(--line); width: max-content; }
  .qr img, .qr canvas { display: block; width: 168px; height: 168px; }
  .url { font-family: ui-monospace, Consolas, monospace; font-size: 15px; word-break: break-all; background: var(--sky); padding: 8px 10px; border-radius: 8px; }

  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  @media (max-width: 760px) { .tiles { grid-template-columns: repeat(2, 1fr); } }
  .tile { background: var(--paper); border: 2px solid var(--line); border-radius: 14px; padding: 12px 16px; }
  .tile .v { font-family: var(--display); font-weight: 700; font-size: 40px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .tile .k { font-size: 14px; color: var(--ink-soft); font-weight: 700; }
  .tile.alert { border-color: var(--sun); background: var(--sun-soft); }

  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
  .tabs { display: inline-flex; border: 2px solid var(--ink); border-radius: 10px; overflow: hidden; }
  .tabs button { border: 0; background: #fff; padding: 8px 16px; font-weight: 700; }
  .tabs button + button { border-left: 2px solid var(--ink); }
  .tabs button.on { background: var(--ink); color: #fff; }
  select.plain { border: 2px solid var(--line); border-radius: 10px; padding: 8px 10px; background: #fff; }

  .gates { display: flex; flex-direction: column; gap: 8px; }
  .gate { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; background: var(--sun-soft);
    border: 2px solid var(--sun); border-radius: 12px; padding: 10px 14px; }
  .gate b { font-family: var(--display); font-weight: 700; font-size: 22px; }

  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }
  .team { background: var(--paper); border: 2px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  .team.gate-on { border-color: var(--sun); box-shadow: 0 0 0 3px var(--sun-soft); }
  .team.lock-on { border-color: var(--summer); }
  .team.done-on { background: var(--green-soft); border-color: var(--green); }
  .team.off { opacity: .6; }
  .team-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .team-name { font-family: var(--display); font-weight: 700; font-size: 26px; line-height: 1.1; }
  .team-mem { font-size: 13px; color: var(--ink-soft); }
  .score { font-family: var(--display); font-weight: 700; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; text-align: right; }
  .score small { display: block; font-family: var(--body); font-size: 12px; color: var(--ink-soft); }
  .chip-s { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 999px; width: max-content; }
  .chip-s::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .st-play { background: #E3EEFA; color: var(--winter); }
  .st-map { background: var(--sky); color: var(--ink-soft); }
  .st-gate { background: var(--sun-soft); color: #8A5A00; }
  .st-lock { background: var(--red-soft); color: var(--summer); }
  .st-done { background: #fff; color: var(--green); }
  .st-off { background: #EEE; color: #666; }
  .st-idle { background: #F3E8FF; color: #6B3FA0; }
  .segs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
  .seg6 { height: 12px; border-radius: 4px; background: var(--line); position: relative; overflow: hidden; }
  .seg6.done { background: var(--green); }
  .seg6.now { background: var(--sun-soft); outline: 2px solid var(--sun); }
  .seg6.now i { position: absolute; inset: 0 auto 0 0; background: var(--sun); }
  .where { font-size: 14px; }
  .stats { display: flex; gap: 14px; font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; flex-wrap: wrap; }
  .stats b { color: var(--ink); }
  .concl { background: #fff; border: 1.5px solid var(--green); border-radius: 10px; padding: 8px 10px; font-size: 14px; }
  .mini { border: 0; background: transparent; color: var(--ink-soft); font-size: 13px; text-decoration: underline; padding: 0; }
  .btn.s { font-size: 16px; padding: 8px 14px; box-shadow: 0 3px 0 #b77800; }

  /* 순위판 (프로젝터용) */
  .rank { display: flex; flex-direction: column; gap: 10px; }
  .rank-row { display: grid; grid-template-columns: 60px minmax(120px, 220px) 1fr 90px; gap: 14px; align-items: center;
    background: var(--night); color: #fff; border-radius: 14px; padding: 12px 16px; }
  @media (max-width: 640px) { .rank-row { grid-template-columns: 40px 1fr 70px; } .rank-row .bar { display: none; } }
  .rank-row .no { font-family: var(--display); font-weight: 700; font-size: 34px; color: var(--sun); text-align: center; }
  .rank-row .nm { font-family: var(--display); font-weight: 700; font-size: 28px; line-height: 1.1; }
  .rank-row .bar { height: 22px; border-radius: 11px; background: rgba(255,255,255,.12); overflow: hidden; }
  .rank-row .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--sun), #FFD76A); border-radius: 11px; }
  .rank-row .pt { font-family: var(--display); font-weight: 700; font-size: 30px; text-align: right; font-variant-numeric: tabular-nums; }
  .rank-row .cl { font-size: 13px; opacity: .75; }

  .hard { display: flex; flex-direction: column; gap: 8px; }
  .hard-row { display: grid; grid-template-columns: 48px 1fr; gap: 10px; align-items: start; }
  .hard-row .n { font-family: var(--display); font-weight: 700; font-size: 26px; color: var(--summer); text-align: right; line-height: 1.2; }
  .hard-row .t { font-size: 14px; }

  .notice-form { display: flex; gap: 8px; flex-wrap: wrap; }
  .notice-form input { flex: 1; min-width: 200px; border: 2px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .presets { display: flex; gap: 6px; flex-wrap: wrap; }
  .presets button { border: 1.5px solid var(--line); background: #fff; border-radius: 999px; padding: 4px 12px; font-size: 13px; }
  .confirm { background: var(--red-soft); border: 2px solid var(--summer); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
  .empty { text-align: center; padding: 30px 16px; color: var(--ink-soft); }
  .toast { position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); left: 50%; transform: translateX(-50%); z-index: 80;
    background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 10px; font-weight: 700; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 7px rgba(242,160,7,.18); } }
  .team.gate-on { animation: pulse 1.6s ease-in-out infinite; }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="tilt">|</span> 계절 탐사대 <span style="opacity:.7;font-size:17px">교사 현황판</span></div>
  <span class="pill" id="roomPill" hidden>방 <span class="room-code" id="roomVal"></span></span>
  <span class="pill net" id="netPill" hidden></span>
  <div class="spacer"></div>
  <span class="pill" id="clockPill" hidden>수업 <b id="clockVal">00:00</b></span>
  <button class="ghost-btn" id="leaveBtn" type="button" hidden>방 바꾸기</button>
</header>

<main id="app"></main>

<script>
const MISSIONS = window.MISSIONS;
const RKEY = "season-quest-teacher";
const $app = document.getElementById("app");
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "html") el.innerHTML = v;
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(kid));
  return el;
};
const T = { room: "", teams: {}, view: "cards", sort: "progress", offset: 0, confirmReset: false };
try { const s = JSON.parse(localStorage.getItem(RKEY)); if (s) { T.room = s.room || ""; T.view = s.view || "cards"; T.sort = s.sort || "progress"; } } catch (e) {}
const keep = () => { try { localStorage.setItem(RKEY, JSON.stringify({ room: T.room, view: T.view, sort: T.sort })); } catch (e) {} };
const now = () => Date.now() + T.offset;
const studentURL = (code) => new URL("index.html?room=" + code, location.href).href;
function toast(msg) {
  const t = h("div", { class: "toast", role: "status" }, msg); document.body.append(t); setTimeout(() => t.remove(), 1800);
}

/* ---------------- Firebase 미설정 ---------------- */
function viewNoConfig() {
  $app.replaceChildren(h("section", { class: "panel stack" },
    h("h2", { style: "font-size:28px" }, "Firebase 연결이 필요해요"),
    h("p", { style: "margin:0" }, "실시간 현황판은 모둠 기기들의 진행 상황을 Firebase 실시간 데이터베이스로 모아서 보여 줘요. ",
      h("b", {}, "firebase-config.js"), " 파일에 Firebase 설정을 붙여 넣은 뒤 이 페이지를 새로 고침하세요."),
    h("p", { class: "muted", style: "margin:0" }, "자세한 순서는 저장소의 README.md 'Firebase 연결하기'에 있어요. 설정 전에도 학생 앱(index.html)은 각 기기에서 따로 동작해요.")
  ));
}

/* ---------------- 방 고르기 ---------------- */
function newCode() {
  const A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // 헷갈리는 0/O, 1/I 제외
  let c = ""; for (let i = 0; i < 5; i++) c += A[Math.floor(Math.random() * A.length)];
  return c;
}
function viewEntry() {
  document.getElementById("roomPill").hidden = true;
  document.getElementById("leaveBtn").hidden = true;
  document.getElementById("clockPill").hidden = true;
  const inp = h("input", { id: "roomIn", maxlength: 8, placeholder: "예) 6REUM", value: T.room,
    style: "text-transform:uppercase;letter-spacing:.14em;font-family:var(--display);font-weight:700;font-size:28px;border:2px solid var(--line);border-radius:12px;padding:10px 14px;width:100%" });
  const err = h("p", { class: "small", style: "margin:0;color:var(--summer)" });
  const go = (code) => {
    code = LIVE.clean(code);
    if (!LIVE.valid(code)) { err.textContent = "방 코드는 영문 대문자·숫자 4~8자예요."; return; }
    openRoom(code);
  };
  $app.replaceChildren(h("div", { class: "entry" },
    h("section", { class: "panel stack" },
      h("h2", { style: "font-size:26px" }, "새 수업 방 만들기"),
      h("p", { style: "margin:0" }, "반마다, 수업마다 새 방을 만들면 기록이 섞이지 않아요. 방 코드를 칠판에 적거나 QR 코드를 보여 주세요."),
      h("div", {}, h("button", { class: "btn sun", type: "button", onclick: () => go(newCode()) }, "새 방 만들기"))
    ),
    h("section", { class: "panel stack" },
      h("h2", { style: "font-size:26px" }, "만들어 둔 방 열기"),
      h("div", { class: "field" }, h("label", { for: "roomIn" }, "방 코드"), inp), err,
      h("div", {}, h("button", { class: "btn", type: "button", onclick: () => go(inp.value) }, "방 열기"))
    )
  ));
}

/* ---------------- 방 열기 · 실시간 구독 ---------------- */
let roomRef = null;
function openRoom(code) {
  if (roomRef) roomRef.child("teams").off();
  T.room = code; T.teams = {}; T.confirmReset = false; keep();
  roomRef = LIVE.room(code);
  document.getElementById("roomPill").hidden = false;
  document.getElementById("roomVal").textContent = code;
  document.getElementById("leaveBtn").hidden = false;
  document.getElementById("clockPill").hidden = false;
  const created = roomRef.child("createdAt");
  created.once("value").then((s) => { if (!s.exists()) created.set(firebase.database.ServerValue.TIMESTAMP).catch(() => {}); });
  roomRef.child("teams").on("value", (s) => { T.teams = s.val() || {}; render(); });
  render();
}
document.getElementById("leaveBtn").addEventListener("click", () => { if (roomRef) roomRef.child("teams").off(); roomRef = null; viewEntry(); });

/* ---------------- 상태 계산 ---------------- */
function statusOf(t) {
  const idleMin = (now() - (t.updatedAt || 0)) / 60000;
  if (t.finished) return { k: "done", label: "탐사 완료" };
  if (t.online === false) return { k: "off", label: "연결 끊김" };
  if (t.gate) return { k: "gate", label: "관문 대기 · 발표 준비" };
  if ((t.lockedUntil || 0) > Date.now()) return { k: "lock", label: "오답 · 교과서 다시 읽는 중" };
  if (idleMin > 4) return { k: "idle", label: Math.floor(idleMin) + "분째 멈춤 · 도움 필요?" };
  if (!t.cur) return { k: "map", label: "미션 지도 · 다음 미션 고르는 중" };
  return { k: "play", label: "문제 푸는 중" };
}
function progressOf(t) {
  const done = t.done || {};
  let p = MISSIONS.filter((m) => done[m.id]).length;
  if (t.cur && !done[MISSIONS[t.cur.mi].id]) p += t.cur.qi / MISSIONS[t.cur.mi].questions.length;
  return p / MISSIONS.length;
}
const ago = (ts) => {
  if (!ts) return "-";
  const s = Math.max(0, Math.round((now() - ts) / 1000));
  return s < 10 ? "방금" : s < 60 ? s + "초 전" : Math.floor(s / 60) + "분 전";
};
const mmss = (ms) => { const s = Math.max(0, Math.floor(ms / 1000)); return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); };

/* ---------------- 교사 동작 ---------------- */
function passGate(tid, mid) {
  roomRef.child(`teams/${tid}/pass/${mid}`).set(true).then(() => toast("관문을 통과시켰어요"));
}
function sendNotice(text) {
  text = text.trim(); if (!text) return;
  roomRef.child("notice").set({ text, at: firebase.database.ServerValue.TIMESTAMP }).then(() => toast("모든 모둠에 알림을 보냈어요"));
}
function resetRoom() {
  roomRef.update({ teams: null, notice: null, resetAt: firebase.database.ServerValue.TIMESTAMP })
    .then(() => { T.confirmReset = false; toast("방을 초기화했어요"); render(); });
}
function removeTeam(tid) { roomRef.child("teams/" + tid).remove(); }

/* ---------------- 그리기 ---------------- */
const openDetail = new Set();
const confirmDel = new Set();
function render() {
  if (!roomRef) return;
  const focusId = document.activeElement && document.activeElement.id;
  const draft = document.getElementById("noticeIn") ? document.getElementById("noticeIn").value : "";
  const list = Object.entries(T.teams).filter(([, t]) => t && t.team).map(([id, t]) => ({ id, ...t }));
  const sorters = {
    progress: (a, b) => progressOf(b) - progressOf(a) || (b.score || 0) - (a.score || 0),
    score: (a, b) => (b.score || 0) - (a.score || 0),
    name: (a, b) => a.team.localeCompare(b.team, "ko"),
    wrong: (a, b) => (b.wrong || 0) - (a.wrong || 0),
  };
  list.sort(sorters[T.sort] || sorters.progress);
  const gates = list.filter((t) => t.gate && !t.finished);
  const done = list.filter((t) => t.finished).length;
  const avg = list.length ? Math.round((list.reduce((s, t) => s + progressOf(t), 0) / list.length) * 100) : 0;

  const code = T.room;
  const qrBox = qrFor(code);

  const noticeIn = h("input", { id: "noticeIn", placeholder: "모든 모둠 화면에 띄울 말", maxlength: 60, value: draft });
  const presets = ["5분 남았어요! 지금 미션을 마무리해요.", "교과서 쪽수를 꼭 확인하고 답을 내요.", "모두 손을 멈추고 선생님을 봐요.", "모둠원 모두가 동의했는지 다시 확인해요."];

  const content = [];
  if (list.length === 0) {
    content.push(h("div", { class: "panel empty" }, h("p", { style: "margin:0;font-size:20px" }, "아직 들어온 모둠이 없어요."),
      h("p", { style: "margin:6px 0 0" }, "학생들이 위 주소나 QR로 접속해 방 코드 ", h("b", {}, code), "를 입력하면 여기에 나타나요.")));
  } else if (T.view === "rank") {
    const top = Math.max(...list.map((t) => t.score || 0), 1);
    const ranked = list.slice().sort((a, b) => (b.score || 0) - (a.score || 0));
    content.push(h("div", { class: "rank" }, ranked.map((t, i) => h("div", { class: "rank-row" },
      h("div", { class: "no" }, i + 1),
      h("div", {}, h("div", { class: "nm" }, t.team), h("div", { class: "cl" }, "단서 " + Object.keys(t.done || {}).length + "/6" + (t.finished ? " · 완료" : ""))),
      h("div", { class: "bar" }, h("i", { style: `width:${Math.round(((t.score || 0) / top) * 100)}%` })),
      h("div", { class: "pt" }, t.score || 0)))));
  } else {
    content.push(h("div", { class: "cards" }, list.map(teamCard)));
  }

  $app.replaceChildren(h("div", { class: "stack" },
    h("section", { class: "panel join" },
      qrBox,
      h("div", { class: "stack", style: "gap:8px" },
        h("span", { class: "muted", style: "font-weight:700" }, "학생 입장 방 코드"),
        h("div", { class: "big-code" }, code),
        h("div", { class: "url", id: "joinUrl" }, studentURL(code)),
        h("div", { class: "row" },
          h("button", { class: "btn line", type: "button", style: "font-size:16px;padding:8px 14px", onclick: (e) => {
            navigator.clipboard.writeText(studentURL(code)).then(() => toast("주소를 복사했어요")).catch(() => {
              const r = document.createRange(); r.selectNodeContents(document.getElementById("joinUrl"));
              const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
            });
          } }, "주소 복사"),
          h("span", { class: "small muted" }, "QR로 들어오면 방 코드가 자동으로 입력돼요.")))
    ),
    h("div", { class: "tiles" },
      h("div", { class: "tile" }, h("div", { class: "k" }, "참여 모둠"), h("div", { class: "v" }, list.length)),
      h("div", { class: "tile" }, h("div", { class: "k" }, "평균 진행"), h("div", { class: "v" }, avg + "%")),
      h("div", { class: "tile" + (gates.length ? " alert" : "") }, h("div", { class: "k" }, "관문 대기"), h("div", { class: "v" }, gates.length)),
      h("div", { class: "tile" }, h("div", { class: "k" }, "탐사 완료"), h("div", { class: "v" }, done + "/" + list.length))
    ),
    gates.length ? h("section", { class: "gates", "aria-label": "관문 대기 모둠" }, gates.map((t) => {
      const mi = MISSIONS.findIndex((m) => m.id === t.gate);
      return h("div", { class: "gate" },
        h("div", {}, h("b", {}, t.team), h("span", { style: "margin-left:8px" }, `미션 ${mi + 1} 관문 · 발표 대장이 설명하면 통과시켜 주세요`)),
        h("button", { class: "btn sun s", type: "button", onclick: () => passGate(t.id, t.gate) }, "관문 통과"));
    })) : null,
    h("section", { class: "panel stack", style: "gap:10px" },
      h("div", { class: "notice-form" }, noticeIn,
        h("button", { class: "btn", type: "button", style: "font-size:17px;padding:8px 16px", onclick: () => { sendNotice(noticeIn.value); noticeIn.value = ""; } }, "전체 알림 보내기")),
      h("div", { class: "presets" }, presets.map((p) => h("button", { type: "button", onclick: () => sendNotice(p) }, p)))
    ),
    h("div", { class: "toolbar" },
      h("div", { class: "tabs", role: "tablist" },
        h("button", { type: "button", class: T.view === "cards" ? "on" : "", onclick: () => { T.view = "cards"; keep(); render(); } }, "모둠 카드"),
        h("button", { type: "button", class: T.view === "rank" ? "on" : "", onclick: () => { T.view = "rank"; keep(); render(); } }, "순위판 (TV용)")),
      T.view === "cards" ? h("label", { class: "row small" }, "정렬",
        h("select", { class: "plain", id: "sortSel", onchange: (e) => { T.sort = e.target.value; keep(); render(); } },
          [["progress", "진행 많은 순"], ["score", "점수 높은 순"], ["wrong", "오답 많은 순"], ["name", "모둠 이름 순"]].map(([v, l]) => h("option", { value: v, selected: T.sort === v }, l)))) : null
    ),
    ...content,
    list.length ? hardQuestions(list) : null,
    h("section", { class: "panel stack", style: "gap:10px" },
      h("h3", { style: "font-size:20px" }, "방 관리"),
      T.confirmReset
        ? h("div", { class: "confirm" },
            h("b", {}, `방 ${code}의 모든 모둠 기록을 지우고, 학생 화면을 처음 등록 화면으로 돌릴까요?`),
            h("div", { class: "row" },
              h("button", { class: "btn", type: "button", style: "background:var(--summer);box-shadow:none;font-size:17px;padding:8px 16px", onclick: resetRoom }, "모두 지우고 새로 시작"),
              h("button", { class: "btn line", type: "button", style: "font-size:17px;padding:8px 16px", onclick: () => { T.confirmReset = false; render(); } }, "취소")))
        : h("div", { class: "row" },
            h("button", { class: "btn line", type: "button", style: "font-size:17px;padding:8px 16px", onclick: () => { T.confirmReset = true; render(); } }, "방 초기화"),
            h("span", { class: "small muted" }, "다음 반 수업에는 '방 바꾸기 → 새 방 만들기'를 추천해요."))
    )
  ));
  if (focusId) { const el = document.getElementById(focusId); if (el) el.focus(); }
  tickClock(list);
}

// QR은 방마다 한 번만 만들어 두고 다시 써요 (5초마다 다시 그려도 깜빡이지 않게)
const qrCache = {};
function qrFor(code) {
  if (qrCache[code]) return qrCache[code];
  const box = h("div", { class: "qr", "aria-label": "학생 접속 QR 코드" });
  try { new QRCode(box, { text: studentURL(code), width: 168, height: 168, correctLevel: QRCode.CorrectLevel.M }); }
  catch (e) { box.replaceChildren(h("span", { class: "small muted" }, "QR을 만들 수 없어요")); }
  return (qrCache[code] = box);
}

function teamCard(t) {
  const st = statusOf(t);
  const done = t.done || {};
  const segs = MISSIONS.map((m, i) => {
    if (done[m.id]) return h("div", { class: "seg6 done", title: `미션 ${i + 1} 완료 · +${done[m.id].score}점` });
    if (t.cur && t.cur.mi === i) return h("div", { class: "seg6 now", title: `미션 ${i + 1} 진행 중` },
      h("i", { style: `width:${Math.round((t.cur.qi / m.questions.length) * 100)}%` }));
    return h("div", { class: "seg6" });
  });
  let where = "미션 지도에서 다음 미션을 고르는 중";
  if (t.finished) where = "모든 미션 해결!";
  else if (t.cur) { const m = MISSIONS[t.cur.mi]; where = `미션 ${t.cur.mi + 1} ${m.title} · 문제 ${t.cur.qi + 1}/${m.questions.length}`; }
  const cls = { gate: " gate-on", lock: " lock-on", done: " done-on", off: " off" }[st.k] || "";
  const open = openDetail.has(t.id);
  return h("article", { class: "team" + cls },
    h("div", { class: "team-top" },
      h("div", {}, h("div", { class: "team-name" }, t.team), h("div", { class: "team-mem" }, (t.members || []).join(" · "))),
      h("div", { class: "score" }, t.score || 0, h("small", {}, "점"))),
    h("span", { class: "chip-s st-" + st.k }, st.label),
    h("div", { class: "segs", "aria-label": "미션 진행" }, segs),
    h("div", { class: "where" }, where),
    h("div", { class: "stats" },
      h("span", {}, "오답 ", h("b", {}, t.wrong || 0)),
      h("span", {}, "힌트 ", h("b", {}, t.hints || 0)),
      h("span", {}, "경과 ", h("b", {}, t.startedAt ? mmss(now() - t.startedAt) : "-")),
      h("span", {}, "활동 ", h("b", {}, ago(t.updatedAt)))),
    t.gate && !t.finished ? h("button", { class: "btn sun s", type: "button", onclick: () => passGate(t.id, t.gate) }, "관문 통과시키기") : null,
    t.conclusion ? h("div", { class: "concl" }, h("b", {}, "우리 모둠의 결론 "), t.conclusion) : null,
    open ? h("div", { class: "small", style: "display:flex;flex-direction:column;gap:2px" },
      MISSIONS.map((m, i) => h("span", {}, `미션 ${i + 1} ${m.title}: `, h("b", {}, done[m.id] ? "+" + done[m.id].score + "점" : "-"))),
      h("span", {}, "틀린 문제: ", h("b", {}, Object.entries(t.wrongBy || {}).map(([k, n]) => k.replace("-", " 문제 ").replace(/m(\d)/, "미션 $1") + ` (${n}회)`).join(", ") || "없음"))) : null,
    h("div", { class: "row", style: "justify-content:space-between" },
      h("button", { class: "mini", type: "button", onclick: () => { open ? openDetail.delete(t.id) : openDetail.add(t.id); render(); } }, open ? "접기" : "자세히"),
      confirmDel.has(t.id)
        ? h("span", { class: "row small" }, "이 모둠을 지울까요?",
            h("button", { class: "mini", type: "button", style: "color:var(--summer)", onclick: () => { confirmDel.delete(t.id); removeTeam(t.id); } }, "지우기"),
            h("button", { class: "mini", type: "button", onclick: () => { confirmDel.delete(t.id); render(); } }, "취소"))
        : h("button", { class: "mini", type: "button", onclick: () => { confirmDel.add(t.id); render(); } }, "모둠 지우기"))
  );
}

// 반 전체에서 많이 틀린 문제 → 수업 중 다시 짚어 줄 곳
function hardQuestions(list) {
  const cnt = {};
  list.forEach((t) => Object.entries(t.wrongBy || {}).forEach(([k, n]) => { cnt[k] = (cnt[k] || 0) + n; }));
  const top = Object.entries(cnt).sort((a, b) => b[1] - a[1]).slice(0, 3);
  if (!top.length) return null;
  return h("section", { class: "panel stack", style: "gap:10px" },
    h("h3", { style: "font-size:20px" }, "우리 반이 많이 틀린 문제"),
    h("div", { class: "hard" }, top.map(([k, n]) => {
      const [mid, qi] = k.split("-"); const mi = MISSIONS.findIndex((m) => m.id === mid);
      const q = MISSIONS[mi] && MISSIONS[mi].questions[+qi];
      return h("div", { class: "hard-row" }, h("div", { class: "n" }, n + "회"),
        h("div", { class: "t" }, h("b", {}, `미션 ${mi + 1} · 문제 ${+qi + 1}`), " ", h("span", { class: "book", style: "font-size:12px" }, q ? q.book : ""),
          h("div", {}, q ? q.prompt : "")));
    })));
}

/* 수업 시계: 가장 먼저 시작한 모둠 기준 */
let firstStart = 0;
function tickClock(list) { if (list) firstStart = list.reduce((m, t) => (t.startedAt && (!m || t.startedAt < m) ? t.startedAt : m), 0); }
setInterval(() => {
  document.getElementById("clockVal").textContent = firstStart ? mmss(Date.now() - firstStart) : "00:00";
}, 1000);
// '방금/n분 전', 잠김 해제, 멈춤 표시를 갱신
setInterval(() => { if (roomRef && !document.getElementById("noticeIn")?.matches(":focus")) render(); }, 5000);

/* ---------------- 시작 ---------------- */
if (!LIVE.on) viewNoConfig();
else {
  LIVE.db.ref(".info/serverTimeOffset").on("value", (s) => { T.offset = s.val() || 0; });
  const pill = document.getElementById("netPill");
  LIVE.onConnected((ok) => { pill.hidden = false; pill.textContent = ok ? "● 연결됨" : "○ 연결 끊김"; pill.classList.toggle("off", !ok); });
  const urlRoom = LIVE.clean(new URLSearchParams(location.search).get("room"));
  if (LIVE.valid(urlRoom)) openRoom(urlRoom);
  else if (LIVE.valid(T.room)) openRoom(T.room);
  else viewEntry();
}
</script>
