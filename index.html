<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>계절 탐사대 23.5</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
<!-- Firebase (실시간 현황판용). firebase-config.js를 채우지 않으면 이 기기에서만 동작해요. -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="live.js"></script>
<script src="missions.js"></script>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="tilt">|</span> 계절 탐사대 23.5</div>
  <span class="pill" id="teamPill" hidden></span>
  <span class="pill net" id="netPill" hidden></span>
  <span class="pill me" id="mePill" hidden></span>
  <div class="spacer"></div>
  <span class="pill" id="timePill" hidden>⏱ <b id="timeVal">00:00</b></span>
  <span class="pill" id="scorePill" hidden>점수 <b id="scoreVal">0</b></span>
  <button class="ghost-btn" id="teacherBtn" type="button">선생님</button>
</header>

<main id="app"></main>

<script>
/* =========================================================
   계절 탐사대 23.5  —  6학년 2학기 과학 1. 계절의 변화 8-9차시
   "계절 변화의 원인을 찾아라!"  (교과서 24~27쪽, 실험관찰 16~17쪽)

   두 가지 방법으로 할 수 있어요
   · 각자 패드(multi): 모둠 상태가 Firebase에 있고, 모든 패드가 같은 화면을 봐요.
                       단계마다 그 역할을 맡은 친구의 패드에서만 누를 수 있어요.
   · 패드 한 대(solo): 지금까지처럼 한 대로 해요. 상태는 이 기기에 저장돼요.
   ========================================================= */

const ROLES = [
  { name: "읽기 대장", job: "교과서의 해당 쪽을 모둠원에게 소리 내어 읽어 줘요." },
  { name: "기록 대장", job: "모둠이 합의한 답을 화면에 입력해요. 혼자 정하면 안 돼요!" },
  { name: "확인 대장", job: "교과서에서 답의 근거 문장을 찾아 손가락으로 짚어 줘요." },
  { name: "발표 대장", job: "왜 그 답인지 모둠 친구들에게 설명하고, 선생님 관문에서 발표해요." },
];
const R_READ = 0, R_WRITE = 1, R_CHECK = 2, R_TALK = 3;

const DEFAULTS = { code: "2350", lockSec: 15, readSec: 20 };
const MISSIONS = window.MISSIONS;

/* ---------------- 작은 도구 ---------------- */
const $app = document.getElementById("app");
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "html") el.innerHTML = v;
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(kid));
  return el;
};
const shuffle = (a, seed) => {
  const arr = a.slice(); let s = seed || 7;
  for (let i = arr.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor((s / 233280) * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
  return arr;
};
const bookTag = (t) => h("span", { class: "book" }, t);
const clone = (o) => (o == null ? o : JSON.parse(JSON.stringify(o)));
const list = (x) => (x == null ? [] : Array.isArray(x) ? x.filter((v) => v != null) : Object.values(x));
// Firebase는 배열의 빈 칸을 지우기도 해서, 길이를 맞춰 다시 채워요
const fill = (x, n, empty) => Array.from({ length: n }, (_, i) => (x != null && x[i] != null ? x[i] : empty));
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const warn = (e) => console.warn(e);
const SERVER_TS = () => firebase.database.ServerValue.TIMESTAMP;

/* ---------------- 이 기기 정보 ---------------- */
// ?pad=이름 을 붙이면 한 브라우저에서 패드 여러 대를 흉내 낼 수 있어요 (수업 전 미리 보기용)
const DKEY = "season-quest-device-v2" + (new URLSearchParams(location.search).get("pad") || "");
try { localStorage.removeItem("season-quest-235"); } catch (e) {}
function freshDevice() {
  return { settings: { ...DEFAULTS }, mode: null, room: "", tid: "", me: -1, noticeSeen: 0, seenClear: 0, soloT: null };
}
let D = (() => {
  try { const d = JSON.parse(localStorage.getItem(DKEY)); if (d && d.settings) return { ...freshDevice(), ...d }; } catch (e) {}
  return freshDevice();
})();
function saveDevice() { try { localStorage.setItem(DKEY, JSON.stringify(D)); } catch (e) {} }

let offset = 0;
if (LIVE.on) LIVE.db.ref(".info/serverTimeOffset").on("value", (s) => { offset = s.val() || 0; });
const now = () => Date.now() + offset;

/* ---------------- 모둠 공유 상태 ----------------
   T = { team, members, roleMap, mode, startedAt, score, done, wrong, wrongBy, hints, conclusion,
         cur: { mi, qi, phase:"intro"|"q", readStart, score, tries, hinted, draft, agree, fb, result },
         gate, lockedUntil, cleared:{mi,at}, finished, pass:{m4:true}, devices:{k:true}, online } */
let T = null;
let teamRef = null;
const LOCAL = { home: "home", cert: false };

function setPath(obj, path, val) {
  const ks = path.split("/"); let o = obj;
  for (let i = 0; i < ks.length - 1; i++) { if (o[ks[i]] == null || typeof o[ks[i]] !== "object") o[ks[i]] = {}; o = o[ks[i]]; }
  const last = ks[ks.length - 1];
  if (val === null || val === undefined) delete o[last]; else o[last] = clone(val);
}
const Store = {
  // 몇 칸만 바꿀 때 (답 고르기, 동의 등)
  update(patch) {
    if (!T) return;
    if (D.mode === "multi") { teamRef.update({ ...patch, updatedAt: SERVER_TS() }).catch(warn); return; }
    for (const [p, v] of Object.entries(patch)) setPath(T, p, v);
    commitSolo();
  },
  // 점수·단계처럼 두 번 반영되면 안 되는 변화: 최신 상태를 보고 바꿔요 (fn이 false면 취소)
  tx(fn) {
    if (!T) return;
    if (D.mode === "multi") {
      teamRef.transaction((cur) => { if (!cur) return; const d = clone(cur); if (!fn(d)) return; d.updatedAt = now(); return d; }).catch(warn);
      return;
    }
    const d = clone(T); if (!fn(d)) return; T = d; commitSolo();
  },
};
let soloTimer = null;
function commitSolo() {
  T.updatedAt = now(); D.soloT = T; saveDevice(); schedule();
  if (!teamRef) return;
  clearTimeout(soloTimer);
  soloTimer = setTimeout(() => {
    if (!T || !teamRef) return;
    const { pass, devices, ...rest } = T;
    for (const k of ["cur", "gate", "cleared", "lockedUntil", "wrongBy", "done", "conclusion"]) if (!(k in rest)) rest[k] = null;
    teamRef.update({ ...rest, online: true, updatedAt: SERVER_TS() }).catch(warn);
  }, 250);
}

/* ---------------- 연결 ---------------- */
function openTeam() {
  if (D.mode === "solo") T = D.soloT;
  if (LIVE.on && D.room && D.tid) {
    teamRef = LIVE.room(D.room).child("teams/" + D.tid);
    if (D.mode === "multi") teamRef.on("value", onTeamValue);
    else { teamRef.child("pass").on("value", (s) => { if (T) { T.pass = s.val() || null; schedule(); } }); commitSolo(); }
    listenRoom();
    presence(true);
  }
  schedule();
}
function onTeamValue(s) {
  const v = s.val();
  if (!v) { if (T) leaveTeam(false, "모둠 기록이 지워졌어요. 다시 들어와 주세요."); return; }
  T = v; schedule();
}
function leaveTeam(removeRemote, msg) {
  if (teamRef) {
    teamRef.off(); teamRef.child("pass").off();
    if (D.mode === "multi") { const dev = teamRef.child("devices/" + D.me); dev.onDisconnect().cancel(); dev.remove().catch(() => {}); }
    else { teamRef.child("online").onDisconnect().cancel(); if (removeRemote) teamRef.remove(); }
  }
  teamRef = null; T = null;
  D = { ...freshDevice(), settings: D.settings, room: D.room, noticeSeen: D.noticeSeen }; saveDevice();
  LOCAL.home = "home"; LOCAL.cert = false;
  if (msg) showNotice(msg);
  schedule();
}
// 접속 표시: 각자 패드면 devices/{내 번호}, 한 대면 online
let connected = false;
function presence(ok) {
  if (!teamRef || !ok) return;
  if (D.mode === "multi") { const dev = teamRef.child("devices/" + D.me); dev.set(true).catch(warn); dev.onDisconnect().remove(); }
  else { teamRef.child("online").onDisconnect().set(false); }
}
if (LIVE.on) LIVE.onConnected((ok) => { connected = ok; presence(ok); updateBar(); });

let roomListening = "";
function listenRoom() {
  if (!LIVE.on || !D.room || roomListening === D.room) return;
  roomListening = D.room;
  const room = LIVE.room(D.room);
  room.child("notice").on("value", (s) => {
    const n = s.val();
    if (!n || !n.text || n.at <= D.noticeSeen || !T || n.at < T.startedAt) return;
    D.noticeSeen = n.at; saveDevice(); showNotice(n.text);
  });
  room.child("resetAt").on("value", (s) => {
    const t = s.val();
    if (t && T && t > T.startedAt) leaveTeam(false, "선생님이 탐사를 새로 시작했어요. 모둠을 다시 만들어 주세요.");
  });
}
function showNotice(text) {
  document.querySelectorAll(".notice").forEach((n) => n.remove());
  const box = h("div", { class: "notice pop", role: "alert" },
    h("b", {}, "선생님 알림"), h("span", {}, text),
    h("button", { class: "btn", type: "button", onclick: () => box.remove() }, "확인"));
  document.body.append(box);
}

/* ---------------- 역할과 차례 ---------------- */
// 선잇기로 정한 첫 역할에서 시작해 미션마다 한 칸씩 돌아가요
const roleMapOf = (k) => list(T && T.roleMap && T.roleMap[k]);
const membersOf = () => list(T && T.members);
function whoHas(mi, ri) { return membersOf().filter((_, k) => roleMapOf(k).some((r) => (r + mi) % 4 === ri)); }
function rolesOfMe(mi) { return D.mode === "solo" ? [0, 1, 2, 3] : roleMapOf(D.me).map((r) => (r + mi) % 4); }
const can = (mi, ri) => rolesOfMe(mi).includes(ri);
const meName = () => (D.mode === "multi" ? membersOf()[D.me] : "");
const namesOf = (mi, ri) => whoHas(mi, ri).join(", ") || "-";
// 패드가 접속해 있는 모둠원 (한 대 모드는 모두 접속한 것으로 봐요)
const online = (k) => D.mode !== "multi" || !!(T && T.devices && T.devices[k]);
const holdersOf = (mi, ri) => membersOf().map((_, k) => k).filter((k) => roleMapOf(k).some((r) => (r + mi) % 4 === ri));
// 그 역할을 맡은 친구가 모두 결석·미접속이면, 접속한 누구나 대신할 수 있어요
const covering = (mi, ri) => D.mode === "multi" && !can(mi, ri) && online(D.me) && !holdersOf(mi, ri).some(online);
const canAct = (mi, ri) => can(mi, ri) || covering(mi, ri);
// 자동 처리(선생님 관문 통과)는 역할을 맡은 접속자 중 번호가 가장 앞선 패드가, 없으면 접속한 첫 패드가 해요
const autoDoer = (mi, ri) => { const h = holdersOf(mi, ri).filter(online); return h.length ? h[0] : membersOf().findIndex((_, k) => online(k)); };
const nextMissionIndex = () => MISSIONS.findIndex((m) => !(T.done && T.done[m.id]));

/* ---------------- 상단 바 · 잠금 ---------------- */
function updateBar() {
  const on = !!T;
  const $ = (id) => document.getElementById(id);
  ["teamPill", "timePill", "scorePill"].forEach((id) => ($(id).hidden = !on));
  const net = $("netPill");
  net.hidden = !(on && teamRef);
  if (on && teamRef) { net.textContent = connected ? "● 방 " + D.room + " 연결됨" : "○ 연결 끊김"; net.classList.toggle("off", !connected); }
  const mp = $("mePill");
  mp.hidden = !(on && D.mode === "multi");
  if (!on) return;
  $("teamPill").textContent = T.team + " 모둠";
  $("scoreVal").textContent = T.score || 0;
  if (D.mode === "multi") {
    const mi = T.cur ? T.cur.mi : Math.max(0, nextMissionIndex());
    mp.replaceChildren("나: ", h("b", {}, meName() || "?"), " · " + rolesOfMe(mi).map((r) => ROLES[r].name).join(", "));
  }
}
let lockBox = null;
function updateLock() {
  const left = T && T.cur && T.cur.phase === "q" ? Math.ceil(((T.lockedUntil || 0) - now()) / 1000) : 0;
  if (left <= 0) { if (lockBox) { lockBox.remove(); lockBox = null; schedule(); } return; }
  const q = MISSIONS[T.cur.mi].questions[T.cur.qi];
  if (!lockBox) {
    lockBox = h("div", { class: "lock", role: "alertdialog", "aria-label": "잠시 잠김" },
      h("div", { class: "lock-box pop" },
        h("h2", { style: "font-size:28px" }, "교과서 다시 읽기 시간"),
        h("div", { class: "lock-count" }, left),
        bookTag(q.book),
        h("p", { style: "margin:0" }, h("b", {}, namesOf(T.cur.mi, R_READ)), " (읽기 대장)이 해당 부분을 다시 소리 내어 읽고, 모둠이 함께 이야기해 보세요.")));
    document.body.append(lockBox);
  }
  lockBox.querySelector(".lock-count").textContent = left;
}
setInterval(() => {
  if (T && T.startedAt) {
    const sec = Math.max(0, Math.floor((now() - T.startedAt) / 1000));
    document.getElementById("timeVal").textContent = String(Math.floor(sec / 60)).padStart(2, "0") + ":" + String(sec % 60).padStart(2, "0");
  }
  updateLock();
  if (screen && screen.tick) screen.tick();
}, 500);

/* ---------------- 화면 고르기 ---------------- */
let screen = null, rafId = 0;
function schedule() { if (!rafId) rafId = setTimeout(() => { rafId = 0; render(); }, 0); }
function screenKey() {
  if (!D.mode || !T) return "home:" + LOCAL.home;
  // 미션이 끝난 직후 늦게 도착한 동의 등으로 생긴 빈 cur 는 무시해요
  const c = T.cur && T.cur.phase ? T.cur : null;
  if (c) return c.phase === "intro" ? `intro:${c.mi}` : `q:${c.mi}:${c.qi}`;
  if (T.cleared && T.cleared.at !== D.seenClear) return `clear:${T.cleared.mi}:${T.cleared.at}`;
  if (LOCAL.cert) return "cert";
  return "map";
}
function render() {
  const key = screenKey();
  if (!screen || screen.key !== key) {
    if (screen && screen.destroy) screen.destroy();
    const [name, ...args] = key.split(":");
    screen = VIEWS[name](...args.map((a) => (/^\d+$/.test(a) ? +a : a)));
    screen.key = key;
    $app.replaceChildren(screen.el);
    window.scrollTo(0, 0);
  }
  if (screen.update) screen.update();
  updateBar();
  updateLock();
}

/* 차례 표시: 지금 누구 차례인지 네 역할 중 하나가 빛나요 */
function turnBar(mi, step) {
  const mine = canAct(mi, step);
  const bar = h("div", { class: "turns" }, ROLES.map((r, ri) =>
    h("div", { class: "turn" + (ri === step ? " now" : "") + (D.mode === "multi" && can(mi, ri) ? " mine" : ""), "data-r": ri },
      h("span", { class: "t-role" }, r.name), h("span", { class: "t-who" }, namesOf(mi, ri)))));
  if (D.mode !== "multi") return bar;
  return h("div", { class: "stack", style: "gap:8px" }, bar,
    mine ? h("p", { class: "my-turn", "data-r": step }, covering(mi, step)
        ? `${ROLES[step].name}(${namesOf(mi, step)})의 패드가 꺼져 있어요. 접속한 누구나 대신 맡을 수 있어요.`
        : "지금 내 차례예요! (" + ROLES[step].name + ")")
      : h("p", { class: "watching" }, "지금은 ", h("b", {}, namesOf(mi, step)), "(" + ROLES[step].name + ")의 차례예요. 화면을 함께 보며 의견을 말해 주세요."));
}

/* ---------------- 첫 화면 ---------------- */
function heroSection() {
  return h("section", { class: "hero" },
    h("div", { class: "stack" },
      h("p", { class: "muted", style: "margin:0" }, "6학년 2학기 과학 · 1. 계절의 변화 · 8~9차시"),
      h("h1", {}, h("span", { class: "t1" }, "계절 변화의 ", h("em", {}, "원인"), "을"), h("span", { class: "t2" }, "찾아라!")),
      h("p", { style: "margin:0" }, "여섯 개의 미션을 모둠이 함께 풀어 계절이 바뀌는 비밀을 밝혀요. 답은 모두 ",
        h("b", {}, "교과서 24~27쪽"), "과 ", h("b", {}, "실험관찰 16~17쪽"), " 안에 있어요. 틀리면 잠깐 잠기니 교과서를 꼼꼼히 읽고 모둠이 합의한 뒤에 답을 내요."),
      h("div", { class: "row" }, bookTag("교과서 24~27쪽"), bookTag("실험관찰 16~17쪽"), h("span", { class: "small muted" }, "약 40분"))),
    h("div", { class: "season-card" }, seasonsArt(false),
      h("p", { class: "seasons-note" }, "노란 햇빛 다발이 땅에 닿는 넓이를 비교해 보세요. 태양이 높을수록 좁은 땅에 햇빛이 모여 더 따뜻해요. (서울 기준, 봄·가을은 춘분·추분 무렵)")));
}
const VIEWS = {};
VIEWS.home = (sub) => {
  if (!LIVE.on) sub = "solo";           // 인터넷 연결 설정이 없으면 한 대로만
  const go = (s) => { LOCAL.home = s; schedule(); };
  let body;
  if (sub === "join") body = joinPanel(go);
  else if (sub === "create" || sub === "solo") body = registerPanel(sub === "create" ? "multi" : "solo", go);
  else body = h("section", { class: "panel stack" },
    h("h2", { style: "font-size:26px" }, "어떻게 시작할까요?"),
    h("div", { class: "starts" },
      h("button", { type: "button", class: "start-card", "data-k": "create", onclick: () => go("create") },
        h("span", { class: "s-title" }, "모둠 만들기"), h("span", { class: "s-sub" }, "모둠장이 먼저 해요"),
        h("span", { class: "s-desc" }, "모둠 이름과 모둠원을 적고 역할을 선으로 이어요. 친구들은 각자 패드로 들어와요.")),
      h("button", { type: "button", class: "start-card", "data-k": "join", onclick: () => go("join") },
        h("span", { class: "s-title" }, "우리 모둠 들어가기"), h("span", { class: "s-sub" }, "모둠원은 여기로"),
        h("span", { class: "s-desc" }, "방 코드를 넣고, 목록에서 우리 모둠과 내 이름을 눌러요.")),
      h("button", { type: "button", class: "start-card", "data-k": "solo", onclick: () => go("solo") },
        h("span", { class: "s-title" }, "패드 한 대로 하기"), h("span", { class: "s-sub" }, "모둠이 한 대를 함께 써요"),
        h("span", { class: "s-desc" }, "와이파이가 불안하거나 패드가 모자랄 때 써요."))));
  return { el: h("div", { class: "stack" }, heroSection(), body) };
};

function roomInput() {
  const urlRoom = LIVE.clean(new URLSearchParams(location.search).get("room"));
  return h("input", { id: "roomCode", placeholder: "칠판의 방 코드", maxlength: 8, autocapitalize: "characters",
    value: urlRoom || D.room || "", style: "text-transform:uppercase;letter-spacing:.12em;font-family:var(--display);font-weight:700;font-size:22px" });
}

function registerPanel(mode, go) {

function enterQ(d, mi, qi) {
  const m = MISSIONS[mi], q = m.questions[qi];
  d.cur = { mi, qi, phase: "q", score: (d.cur && d.cur.score) || 0, tries: 0, hinted: false };
  d.gate = q.type === "checkpoint" ? m.id : "";
  d.lockedUntil = 0;
}

/* ---------------- 문제 ---------------- */
VIEWS.q = (mi, qi) => {
  const m = MISSIONS[mi], q = m.questions[qi];
  const last = qi === m.questions.length - 1;
  const seed = mi * 10 + qi + 3;
  const turnSlot = h("div"), rSlot = h("div"), hintSlot = h("div"), agreeSlot = h("div"), actSlot = h("div"), fbSlot = h("div");
  const localMsg = h("div");
  const el = h("div", { class: "stack" },
    h("div", { class: "q-head" },
      h("span", { class: "muted" }, `미션 ${mi + 1} · ${m.title}`),
      h("div", { class: "dots", "aria-label": `${qi + 1}번째 문제 / ${m.questions.length}` },
        m.questions.map((_, i) => h("span", { class: "dot" + (i < qi ? " ok" : i === qi ? " now" : "") })))),
    h("section", { class: "panel stack" },
      h("div", { class: "row", style: "justify-content:space-between" },
        h("span", { class: "muted" }, `문제 ${qi + 1}/${m.questions.length}`), bookTag(q.book)),
      h("p", { class: "q-prompt", style: "margin:0" }, q.prompt),
      turnSlot, rSlot, hintSlot, agreeSlot, actSlot, localMsg, fbSlot));

  let R = null, builtJson = null, builtRo = null, sentJson = null, draftTimer = null;
  const say = (text) => localMsg.replaceChildren(text ? h("div", { class: "feedback bad pop" }, text) : "");

  const sendDraft = (st, typing) => {
    sentJson = JSON.stringify(st);
    clearTimeout(draftTimer);
    const push = () => Store.update({ "cur/draft": st, "cur/agree": null, "cur/fb": null });
    if (typing) draftTimer = setTimeout(push, 300); else push();
    say("");
  };

  const pointsOf = (c) => Math.max(2, 10 - (c.tries || 0) * 3 - (c.hinted ? 2 : 0));
  const sameQ = (d) => d.cur && d.cur.phase === "q" && d.cur.mi === mi && d.cur.qi === qi && !d.cur.result;
  const succeed = (extra) => Store.tx((d) => {
    if (!sameQ(d)) return false;
    const pts = pointsOf(d.cur);
    d.cur.result = { pts, at: now() };
    d.cur.score = (d.cur.score || 0) + pts;
    d.score = (d.score || 0) + pts;
    d.gate = "";
    delete d.cur.fb;
    if (extra) extra(d);
    return true;
  });
  const fail = (lack) => Store.tx((d) => {
    if (!sameQ(d)) return false;
    d.cur.tries = (d.cur.tries || 0) + 1;
    d.wrong = (d.wrong || 0) + 1;
    d.wrongBy = d.wrongBy || {};
    const k = m.id + "-" + qi; d.wrongBy[k] = (d.wrongBy[k] || 0) + 1;
    d.lockedUntil = now() + D.settings.lockSec * 1000;
    delete d.cur.agree;
    d.cur.fb = { at: now(), lack: lack || "" };
    return true;
  });
  const next = () => Store.tx((d) => {
    if (!d.cur || d.cur.mi !== mi || d.cur.qi !== qi || !d.cur.result) return false;
    if (last) {
      d.done = d.done || {};
      d.done[m.id] = { score: d.cur.score || 0 };
      delete d.cur; d.gate = ""; d.lockedUntil = 0;
      d.cleared = { mi, at: now() };
      d.finished = MISSIONS.every((mm) => d.done[mm.id]);
    } else enterQ(d, mi, qi + 1);
    return true;
  });
  const submit = () => {
    const draft = normDraft(q, T.cur.draft);
    const res = CHECK[q.type](q, draft);
    if (res === null) return say("아직 고르지 않은 칸이 있어요. 기록 대장이 모두 채운 뒤 다시 확인해요.");
    if (res === "pending") return say("시뮬레이터에서 8곳을 모두 측정해야 기록을 확인할 수 있어요.");
    say("");
    if (res === true || (res && res.ok)) succeed(q.type === "write" ? (d) => { d.conclusion = draft.text; } : null);
    else fail(res && res.lack ? res.lack.join(", ") : "");
  };

  let gateDone = false;
  const update = () => {
    const c = T.cur; if (!c || c.phase !== "q") return;
    const members = membersOf();
    const agree = c.agree || {};
    // 동의는 패드가 접속한 친구들만 누르면 돼요 (결석한 친구 때문에 멈추지 않게)
    const need = members.map((_, k) => k).filter(online);
    const allAgreed = need.length > 0 && need.every((k) => agree[k]);
    const locked = (T.lockedUntil || 0) > now();
    const step = c.result || q.type === "checkpoint" ? R_TALK : allAgreed ? R_CHECK : R_WRITE;
    turnSlot.replaceChildren(turnBar(mi, step));

    // 답 영역: 기록 대장만 조작하고, 다른 친구 패드에는 같은 답이 실시간으로 보여요
    const ro = q.type === "checkpoint" ? !canAct(mi, R_TALK) : (!canAct(mi, R_WRITE) || !!c.result);
    const draft = normDraft(q, c.draft);
    const dj = JSON.stringify(draft);
    if (!R || builtRo !== ro || (dj !== builtJson && dj !== sentJson)) {
      R = RENDER[q.type](q, seed, draft, { ro, change: sendDraft, onCode: (code) => {
        if (code === String(D.settings.code)) succeed(); else fail("");
      } });
      builtJson = dj; builtRo = ro;
      rSlot.replaceChildren(ro && q.type !== "checkpoint" && D.mode === "multi" && !c.result
        ? h("div", { class: "watch-wrap" }, h("span", { class: "watch-tag" }, "기록 대장 " + namesOf(mi, R_WRITE) + "의 화면"), R.el)
        : R.el);
    }

    hintSlot.replaceChildren(c.hinted ? h("div", { class: "hint" }, h("b", {}, "힌트 (−2점) "), q.hint) : "");

    // 모둠 합의: 각자 자기 패드에서 자기 이름을 눌러요 (한 대면 모두 누를 수 있어요)
    if (q.type === "checkpoint" || c.result) agreeSlot.replaceChildren();
    else agreeSlot.replaceChildren(h("div", { class: "agree" },
      h("p", { style: "margin:0;font-weight:700" }, D.mode === "multi" ? "모둠 합의: 이 답에 동의하면 내 이름을 눌러요" : "모둠 합의: 모두가 이 답에 동의하면 자기 이름을 눌러요"),
      h("div", { class: "row" }, members.map((nm, k) => {
        const mine = D.mode !== "multi" || k === D.me;
        const away = !online(k);
        return h("button", { type: "button", class: "chip" + (agree[k] ? " on" : "") + (mine ? "" : " other") + (away ? " away" : ""), disabled: !mine || locked,
          onclick: () => Store.update({ ["cur/agree/" + k]: agree[k] ? null : true }) }, nm + (agree[k] ? " ✓" : away ? " (미접속)" : ""));
      }))));

    // 버튼: 차례인 역할의 패드에만 보여요
    const acts = [];
    if (!c.result && q.type !== "checkpoint") {
      if (canAct(mi, R_CHECK)) {
        acts.push(h("button", { class: "btn sun", type: "button", disabled: !allAgreed || locked, onclick: submit },
          D.mode === "multi" ? "근거 찾았어요 · 정답 확인" : "정답 확인"));
        if (!c.hinted) acts.push(h("button", { class: "btn line", type: "button", onclick: () => Store.tx((d) => {
          if (!sameQ(d) || d.cur.hinted) return false; d.cur.hinted = true; d.hints = (d.hints || 0) + 1; return true;
        }) }, "힌트 보기 (−2점)"));
        if (!allAgreed) acts.push(h("span", { class: "small muted" }, "모두 동의하면 누를 수 있어요."));
      } else {
        acts.push(h("p", { class: "watching" }, allAgreed
          ? ["확인 대장 ", h("b", {}, namesOf(mi, R_CHECK)), "이(가) 교과서에서 근거를 확인하고 정답을 확인해요."]
          : ["모두 동의하면 확인 대장 ", h("b", {}, namesOf(mi, R_CHECK)), "이(가) 정답을 확인해요."]));
      }
    }
    if (!c.result && q.type === "checkpoint" && !canAct(mi, R_TALK))
      acts.push(h("p", { class: "watching" }, "발표 대장 ", h("b", {}, namesOf(mi, R_TALK)), "이(가) 선생님께 발표해요. 함께 들어 주세요."));
    actSlot.replaceChildren(acts.length ? h("div", { class: "row" }, acts) : "");

    // 결과
    if (c.result) {
      const talk = canAct(mi, R_TALK);
      fbSlot.replaceChildren(h("div", { class: "feedback good pop stack", style: "gap:8px" },
        h("h3", {}, "정답! +" + c.result.pts + "점"),
        h("p", { style: "margin:0" }, q.explain),
        h("p", { class: "small", style: "margin:0" }, h("b", {}, namesOf(mi, R_TALK)), " (발표 대장): 왜 이게 정답인지 모둠 친구들에게 설명해 주세요."),
        talk ? h("div", {}, h("button", { class: "btn", type: "button", onclick: next }, last ? "설명했어요 · 미션 완료!" : "설명했어요 · 다음 문제 →"))
          : h("p", { class: "watching", style: "margin:0" }, "발표 대장이 설명을 마치면 다음으로 넘어가요.")));
    } else if (c.fb) {
      fbSlot.replaceChildren(h("div", { class: "feedback bad pop" }, h("b", {}, "아쉬워요. "),
        c.fb.lack ? ["빠진 낱말: ", h("b", {}, c.fb.lack), ". "] : "",
        "교과서의 ", h("b", {}, q.book), " 부분을 모둠이 함께 다시 읽고, 확인 대장이 근거 문장을 찾아보세요."));
    } else fbSlot.replaceChildren();

    // 선생님이 현황판에서 관문을 통과시키면 발표 대장 패드가 다음 단계로 넘겨요
    if (q.type === "checkpoint" && !c.result && !gateDone && T.pass && T.pass[m.id]
      && (D.mode !== "multi" || D.me === autoDoer(mi, R_TALK))) { gateDone = true; succeed(); }
  };
  let wasLocked = false;
  const tick = () => { const l = (T && (T.lockedUntil || 0) > now()); if (l !== wasLocked) { wasLocked = l; update(); } };
  return { el, update, tick, destroy() { clearTimeout(draftTimer); } };
};

/* ---------------- 답 모양 맞추기 · 채점 ---------------- */
function normDraft(q, d) {
  d = d || {};
  switch (q.type) {
    case "blanks": return { filled: fill(d.filled, q.answer.length, "") };
    case "sort": return { pick: fill(d.pick, q.items.length, -1) };
    case "choice": return { sel: d.sel == null ? -1 : d.sel };
    case "multi": return { sel: list(d.sel) };
    case "ox": return { sel: d.sel || "" };
    case "order": return { picked: list(d.picked) };
    case "match": return { vals: fill(d.vals, q.pairs.length, "") };
    case "nums": return { vals: fill(d.vals, q.fields.length, "") };
    case "grid": return { pick: q.rows.map((_, r) => fill(d.pick && d.pick[r], q.cols.length, -1)) };
    case "write": return { text: d.text != null ? d.text : (T && T.conclusion) || "" };
    case "sim": return { mode: d.mode || "vertical", at: d.at || "", seen: list(d.seen), vals: fill(d.vals, 8, "") };
    default: return {};
  }
}
const num = (v) => parseFloat(String(v).replace(",", "."));
const CHECK = {
  blanks: (q, s) => (s.filled.includes("") ? null : s.filled.every((w, i) => w === q.answer[i])),
  sort: (q, s) => (s.pick.includes(-1) ? null : s.pick.every((p, i) => p === q.items[i].b)),
  choice: (q, s) => (s.sel < 0 ? null : s.sel === q.answer),
  multi: (q, s) => (!s.sel.length ? null : s.sel.length === q.answer.length && q.answer.every((a) => s.sel.includes(a))),
  ox: (q, s) => (s.sel === "" ? null : (s.sel === "o") === q.answer),
  order: (q, s) => (s.picked.length < q.items.length ? null : s.picked.every((p, i) => p === i)),
  match: (q, s) => (s.vals.includes("") ? null : s.vals.every((v, i) => v === q.pairs[i][1])),
  nums: (q, s) => (s.vals.some((v) => String(v).trim() === "") ? null : s.vals.every((v, i) => Math.abs(num(v) - q.fields[i].answer) <= q.fields[i].tol + 1e-9)),
  grid: (q, s) => (s.pick.flat().includes(-1) ? null : s.pick.every((row, r) => row.every((v, c) => v === q.answer[r][c]))),
  write: (q, s) => {
    const t = s.text.replace(/\s/g, "");
    if (t.length < 10) return null;
    const lack = q.keywords.filter((alts) => !alts.some((k) => t.includes(k))).map((a) => a[0]);
    return { ok: !lack.length, lack };
  },
  sim: (q, s) => {
    if (s.seen.length < 8) return "pending";
    if (s.vals.some((v) => String(v).trim() === "")) return null;
    const ans = [...SIM_ORDER.map(([m, p]) => SHADOW[m][p])];
    return s.vals.every((v, i) => Math.abs(num(v) - ans[i]) <= 0.1 + 1e-9);
  },
  checkpoint: () => null,
};

/* ---------------- 문제 유형별 화면 ----------------
   RENDER[type](q, seed, 답 상태, { ro: 보기만, change(새 상태, 타자 중?) })
   기록 대장 패드에서 고르면 바로 다시 그리고, 새 상태를 모둠에 보내요 */
const RENDER = {
  blanks(q, seed, st, o) {
    const s = clone(st);
    const sentence = h("p", { class: "sentence", style: "margin:0" }), bank = h("div", { class: "row" });
    const draw = () => {
      sentence.replaceChildren();
      q.text.split(/(\{\d\})/).forEach((part) => {
        const m = part.match(/\{(\d)\}/);
        if (!m) return sentence.append(part);
        const i = +m[1];
        sentence.append(h("span", { class: "slot" + (s.filled[i] ? "" : " empty"), role: "button", tabindex: o.ro ? -1 : 0,
          onclick: () => { if (o.ro) return; s.filled[i] = ""; draw(); o.change(clone(s)); } }, s.filled[i] || "빈칸"));
      });
      bank.replaceChildren(...shuffle(q.bank, seed).map((w) => {
        const used = s.filled.includes(w);
        return h("button", { type: "button", class: "chip" + (used ? " used" : ""), disabled: used || o.ro, onclick: () => {
          const k = s.filled.indexOf(""); if (k < 0) return; s.filled[k] = w; draw(); o.change(clone(s));
        } }, w);
      }));
    };
    draw();
    return { el: h("div", { class: "stack" }, sentence, o.ro ? null : h("p", { class: "small muted", style: "margin:0" }, "빈칸을 누르면 비울 수 있어요."), bank) };
  },

  sort(q, seed, st, o) {
    const s = clone(st);
    const items = shuffle(q.items.map((it, i) => ({ ...it, i })), seed);
    return { el: h("div", { class: "sort-list" }, items.map((it) => {
      const seg = h("div", { class: "seg", role: "group", "aria-label": it.t });
      q.bins.forEach((b, bi) => seg.append(h("button", { type: "button", "data-tone": b.tone, class: s.pick[it.i] === bi ? "on" : "", disabled: o.ro, onclick: (e) => {
        s.pick[it.i] = bi; seg.querySelectorAll("button").forEach((x) => x.classList.remove("on")); e.currentTarget.classList.add("on"); o.change(clone(s));
      } }, b.t)));
      return h("div", { class: "sort-item" }, h("span", {}, it.t), seg);
    })) };
  },

  choice(q, seed, st, o) {
    const s = clone(st);
    const el = h("div", { class: "opts" }, shuffle(q.options.map((_, i) => i), seed).map((i) => h("button", { type: "button", class: "opt" + (s.sel === i ? " on" : ""), disabled: o.ro, onclick: (e) => {
      s.sel = i; el.querySelectorAll(".opt").forEach((x) => x.classList.remove("on")); e.currentTarget.classList.add("on"); o.change(clone(s));
    } }, q.options[i])));
    return { el };
  },

  multi(q, seed, st, o) {
    const s = clone(st);
    return { el: h("div", { class: "row" }, shuffle(q.options.map((_, i) => i), seed).map((i) => h("button", { type: "button", class: "chip" + (s.sel.includes(i) ? " on" : ""), disabled: o.ro, onclick: (e) => {
      s.sel = s.sel.includes(i) ? s.sel.filter((x) => x !== i) : [...s.sel, i];
      e.currentTarget.classList.toggle("on", s.sel.includes(i)); o.change(clone(s));
    } }, q.options[i]))) };
  },

  ox(q, seed, st, o) {
    const s = clone(st);
    const el = h("div", { class: "ox" });
    const mk = (v, label) => h("button", { type: "button", "data-v": v, class: s.sel === v ? "on" : "", disabled: o.ro, "aria-label": v === "o" ? "맞다" : "틀리다", onclick: (e) => {
      s.sel = v; el.querySelectorAll("button").forEach((x) => x.classList.remove("on")); e.currentTarget.classList.add("on"); o.change(clone(s));
    } }, label);
    el.append(mk("o", "O"), mk("x", "X"));
    return { el };
  },

  order(q, seed, st, o) {
    const s = clone(st);
    const pool = h("div", { class: q.inline ? "row" : "order-pick" });
    const out = h("p", { class: "sentence", style: "margin:0;min-height:2.2em" });
    const draw = () => {
      pool.replaceChildren(...shuffle(q.items.map((_, i) => i), seed).map((i) => {
        const pos = s.picked.indexOf(i);
        const click = () => { if (o.ro) return; pos >= 0 ? s.picked.splice(pos) : s.picked.push(i); draw(); o.change(clone(s)); };
        return q.inline
          ? h("button", { type: "button", class: "chip" + (pos >= 0 ? " on" : ""), disabled: o.ro, onclick: click }, q.items[i])
          : h("button", { type: "button", class: "order-step" + (pos >= 0 ? " on" : ""), disabled: o.ro, onclick: click },
              h("span", { class: "n" }, pos >= 0 ? pos + 1 : ""), h("span", {}, q.items[i]));
      }));
      if (q.inline) out.replaceChildren(...s.picked.map((i) => h("span", { class: "slot" }, q.items[i])));
    };
    draw();
    return { el: h("div", { class: "stack" }, q.inline ? out : null, pool,
      o.ro ? null : h("p", { class: "small muted", style: "margin:0" }, "이미 고른 것을 다시 누르면 그 뒤의 순서가 모두 취소돼요.")) };
  },

  match(q, seed, st, o) {
    const s = clone(st);
    const rights = shuffle(q.pairs.map((p) => p[1]), seed);
    return { el: h("div", { class: "stack", style: "gap:10px" }, q.pairs.map(([term], i) => {
      const sel = h("select", { id: "match" + i, disabled: o.ro, onchange: () => { s.vals[i] = sel.value; o.change(clone(s)); } },
        h("option", { value: "" }, "뜻을 고르세요"), rights.map((r) => h("option", { value: r, selected: s.vals[i] === r }, r)));
      return h("div", { class: "match-row" }, h("span", { class: "term" }, term), sel);
    })) };
  },

  nums(q, seed, st, o) {
    const s = clone(st);
    return { el: h("div", { class: "num-grid" }, q.fields.map((f, i) => h("label", {}, f.label,
      h("input", { id: "num" + i, inputmode: "decimal", value: s.vals[i], readonly: o.ro, oninput: (e) => { s.vals[i] = e.target.value; o.change(clone(s), true); } })))) };
  },

  grid(q, seed, st, o) {
    const s = clone(st);
    const cell = (r, c) => {
      const seg = h("div", { class: "seg" });
      q.opts.forEach((op, oi) => seg.append(h("button", { type: "button", class: s.pick[r][c] === oi ? "on" : "", disabled: o.ro, onclick: (e) => {
        s.pick[r][c] = oi; seg.querySelectorAll("button").forEach((x) => x.classList.remove("on")); e.currentTarget.classList.add("on"); o.change(clone(s));
      } }, op)));
      return h("td", { style: "text-align:center" }, seg);
    };
    return { el: h("div", { class: "tbl-wrap" }, h("table", { class: "grid" },
      h("thead", {}, h("tr", {}, h("th", {}, ""), q.cols.map((c) => h("th", { style: "white-space:pre-line" }, c)))),
      h("tbody", {}, q.rows.map((row, r) => h("tr", {}, h("th", {}, row), q.cols.map((_, c) => cell(r, c))))))) };
  },

  // 관문: 통과 코드는 모둠에 보내지 않고 발표 대장 패드에서만 입력해요
  checkpoint(q, seed, st, o) {
    const inp = h("input", { id: "tcode", type: "password", inputmode: "numeric", placeholder: "선생님 통과 코드", style: "max-width:240px;border:2px solid var(--line);border-radius:10px;padding:10px;font-size:20px;text-align:center" });
    return { el: h("div", { class: "stack", style: "gap:10px" },
      h("div", { class: "hint" }, h("b", {}, "발표 예시 틀: "), "\"자전축이 수직일 때는 그림자 길이가 ___, 기울어졌을 때는 ___. 그래서 ___.\""),
      teamRef ? h("p", { class: "gate-wait", style: "margin:0" }, "선생님 현황판에 '관문 대기'로 표시됐어요. 손을 들고 선생님을 기다리세요. 선생님이 통과시키면 자동으로 넘어가요.") : null,
      o.ro ? null : h("div", { class: "row" }, h("label", { for: "tcode", style: "font-weight:700" }, "통과 코드"), inp,
        h("button", { class: "btn sun", type: "button", onclick: () => { if (inp.value.trim()) o.onCode(inp.value.trim()); } }, "코드 확인"))) };
  },

  write(q, seed, st, o) {
    const s = clone(st);
    const ta = h("textarea", { id: "conclusion", placeholder: "우리 모둠의 결론을 써요.", readonly: o.ro });
    ta.value = s.text;
    ta.addEventListener("input", () => { s.text = ta.value; o.change(clone(s), true); });
    return { el: h("div", { class: "stack", style: "gap:8px" }, ta) };
  },

  sim(q, seed, st, o) { return makeSim(st, o); },
};

/* ---------------- 모형실험 시뮬레이터 ---------------- */
// 실험관찰 16~17쪽 정리값 (단위 cm)
const SHADOW = { vertical: { 가: 1.4, 나: 1.4, 다: 1.4, 라: 1.4 }, tilted: { 가: 1.4, 나: 0.8, 다: 1.4, 라: 3.5 } };
const POS = { 가: [300, 62], 나: [88, 175], 다: [300, 290], 라: [512, 175] };
const SIM_ORDER = [["vertical", "가"], ["vertical", "나"], ["vertical", "다"], ["vertical", "라"], ["tilted", "가"], ["tilted", "나"], ["tilted", "다"], ["tilted", "라"]];

function makeSim(st, o) {
  const s = clone(st);
  const stage = h("div", { class: "sim-stage" });
  const gauge = h("div", { class: "gauge" });
  const status = h("p", { class: "visited", style: "margin:0" });
  const modeSeg = h("div", { class: "seg" },
    h("button", { type: "button", disabled: o.ro, onclick: () => setMode("vertical") }, "자전축 수직"),
    h("button", { type: "button", disabled: o.ro, onclick: () => setMode("tilted") }, "자전축 기울어짐"));
  function setMode(m) { s.mode = m; s.at = ""; draw(); o.change(clone(s)); }

  const table = h("div", { class: "num-grid" });
  let idx = 0;
  [["vertical", "자전축이 수직일 때 (실험관찰 16쪽)"], ["tilted", "자전축이 기울어졌을 때 (실험관찰 17쪽)"]].forEach(([m, label]) => {
    table.append(h("div", { class: "grp" }, label));
    ["가", "나", "다", "라"].forEach((p) => {
      const i = idx++;
      table.append(h("label", {}, p + " 위치", h("input", { id: `sim-${m}-${p}`, inputmode: "decimal", placeholder: "cm", value: s.vals[i], readonly: o.ro,
        oninput: (e) => { s.vals[i] = e.target.value; o.change(clone(s), true); } })));
    });
  });

  function draw() {
    modeSeg.children[0].classList.toggle("on", s.mode === "vertical");
    modeSeg.children[1].classList.toggle("on", s.mode === "tilted");
    const tilt = s.mode === "tilted" ? 23.5 : 0;
    const globe = (name) => {
      const [x, y] = POS[name]; const r = name === "다" ? 42 : name === "가" ? 30 : 36;
      const rad = (tilt * Math.PI) / 180, L = r + 16;
      const dx = Math.sin(rad) * L, dy = Math.cos(rad) * L;
      const sel = s.at === name;
      const lx = 300 - x, ly = 175 - y, len = Math.hypot(lx, ly) || 1;   // 전등 쪽 반구가 밝게
      return `<g class="pos-btn" data-p="${name}" role="button" tabindex="${o.ro ? -1 : 0}" aria-label="${name} 위치">
        <circle cx="${x}" cy="${y}" r="${r + 8}" fill="${sel ? "rgba(242,160,7,.25)" : "transparent"}" stroke="${sel ? "#F2A007" : "transparent"}" stroke-width="3"/>
        <circle cx="${x}" cy="${y}" r="${r}" fill="#1F4F8A"/>
        <circle cx="${x + (lx / len) * r * 0.35}" cy="${y + (ly / len) * r * 0.35}" r="${r * 0.75}" fill="#4F8FD8" opacity=".75"/>
        <line x1="${x - dx}" y1="${y + dy}" x2="${x + dx}" y2="${y - dy}" stroke="#F2A007" stroke-width="3" stroke-dasharray="6 4"/>
        <text x="${x}" y="${y + r + 26}" text-anchor="middle" font-family="Pretendard Variable, Pretendard, sans-serif" font-weight="700" font-size="22" fill="#fff">${name}</text>
      </g>`;
    };
    stage.innerHTML = `<svg viewBox="0 0 600 350" role="img" aria-label="전등 둘레를 공전하는 지구본 모형">
      <ellipse cx="300" cy="175" rx="212" ry="113" fill="none" stroke="#3B4C6B" stroke-width="2" stroke-dasharray="4 6"/>
      <path d="M 210 72 Q 150 95 118 130" fill="none" stroke="#F2C45A" stroke-width="3" marker-end="url(#ah)"/>
      <path d="M 120 225 Q 160 268 240 288" fill="none" stroke="#F2C45A" stroke-width="3" marker-end="url(#ah)"/>
      <path d="M 360 288 Q 440 268 482 225" fill="none" stroke="#F2C45A" stroke-width="3" marker-end="url(#ah)"/>
      <path d="M 480 130 Q 450 95 390 72" fill="none" stroke="#F2C45A" stroke-width="3" marker-end="url(#ah)"/>
      <defs><marker id="ah" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#F2C45A"/></marker>
      <radialGradient id="glow"><stop offset="0" stop-color="#FFF6D6"/><stop offset=".4" stop-color="#FFD76A" stop-opacity=".8"/><stop offset="1" stop-color="#FFD76A" stop-opacity="0"/></radialGradient></defs>
      <circle cx="300" cy="175" r="60" fill="url(#glow)"/>
      <circle cx="300" cy="175" r="16" fill="#FFF6D6"/>
      <text x="300" y="215" text-anchor="middle" font-size="14" fill="#FFE7A3" font-family="Pretendard Variable, Pretendard, sans-serif">전등(태양)</text>
      ${["가", "나", "라", "다"].map(globe).join("")}
      <text x="16" y="336" font-size="13" fill="#9FB0C9" font-family="Pretendard Variable, Pretendard, sans-serif">서쪽 → 동쪽 (시계 반대 방향) 공전 · 주황 점선 = 자전축</text>
    </svg>`;
    if (!o.ro) stage.querySelectorAll(".pos-btn").forEach((g) => {
      const go = () => { s.at = g.dataset.p; if (!s.seen.includes(s.mode + s.at)) s.seen.push(s.mode + s.at); draw(); o.change(clone(s)); };
      g.addEventListener("click", go);
      g.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
    });
    gauge.innerHTML = gaugeSVG(s.at ? SHADOW[s.mode][s.at] : null, s.at, s.mode);
    status.innerHTML = `측정한 곳 <b>${s.seen.length}/8</b> · ` + (s.seen.length < 8 ? "수직·기울어짐 두 경우 모두 가·나·다·라를 눌러 보세요." : "모두 측정했어요! 표에 기록하세요.");
  }
  draw();
  return { el: h("div", { class: "stack" },
    h("div", { class: "row" }, modeSeg),
    h("div", { class: "sim" }, stage, h("div", { class: "stack", style: "gap:8px" }, gauge, status)),
    h("div", { class: "panel stack", style: "gap:8px;padding:14px" }, h("b", {}, "실험관찰에 기록하듯 여기에도 적어요 (단위: cm)"), table)) };
}

/* ---------------- 네 계절 그림 (서울 기준 남중 고도) ---------------- */
// 태양이 높을수록 같은 굵기의 햇빛이 좁은 땅에 모여요 → 일정한 면적이 받는 에너지가 많아요
const SEASONS = [
  { k: "spring", name: "봄", alt: 52, day: "12시간 10분", heat: 2 },
  { k: "summer", name: "여름", alt: 76, day: "14시간 46분", heat: 3 },
  { k: "autumn", name: "가을", alt: 52, day: "12시간 10분", heat: 2 },
  { k: "winter", name: "겨울", alt: 29, day: "9시간 34분", heat: 1 },
];
const SEASON_BY_K = Object.fromEntries(SEASONS.map((s) => [s.k, s]));
// 미션 카드 하늘 띠: 봄 → 여름 → 가을 → 겨울 → (남반구) 여름 → 사계절 정리
const MISSION_SEASON = { m1: "spring", m2: "summer", m3: "autumn", m4: "winter", m5: "summer", m6: "all" };

function rng(seed) { let s = seed; return () => ((s = (s * 9301 + 49297) % 233280) / 233280); }

function seasonScene(s, uid) {
  const G = 150;                                   // 땅 높이
  const a = (s.alt * Math.PI) / 180;
  const sinA = Math.sin(a), tanA = Math.tan(a);
  const hitX = 90;                                 // 햇빛이 닿는 곳
  const hSun = 44 + ((s.alt - 29) / (76 - 29)) * 86; // 태양이 떠 있는 높이 (겨울 44 ~ 여름 130)
  const sy = G - hSun, sx = hitX - hSun / tanA;
  const w = 12;                                    // 햇빛 다발의 굵기
  const nx = -sinA, ny = Math.cos(a), dx = Math.cos(a), dy = sinA;
  const edge = (sign) => {
    const px = sx + sign * nx * (w / 2), py = sy + sign * ny * (w / 2);
    const t = (G - py) / dy;
    return [[px, py], [px + t * dx, G]];
  };
  const [p1, e1] = edge(1), [p2, e2] = edge(-1);
  const patchL = Math.min(e1[0], e2[0]), patchW = Math.abs(e1[0] - e2[0]);
  const glow = 0.2 + 0.75 * sinA * sinA;
  const stickX = 84, stickH = 12, shadow = stickH / tanA;
  const r = rng(s.k.length * 97 + s.alt);
  const f = (n) => n.toFixed(1);

  const skies = { spring: ["#7DB6FF", "#FFD3E6"], summer: ["#1B86FF", "#A8E1FF"], autumn: ["#4C8BDB", "#FFC37E"], winter: ["#4E6588", "#C7D4E5"] };
  let back = "", ground = "", front = "";
  if (s.k === "spring") {
    back = `<polygon points="-5,${G} 22,112 40,128 62,104 92,132 125,110 125,${G}" fill="#C7CBEF"/>
      <polygon points="22,112 30,120 16,120" fill="#fff"/><polygon points="62,104 71,113 54,113" fill="#fff"/><polygon points="125,110 118,117 125,118" fill="#fff"/>`;
    ground = `<rect y="${G}" width="120" height="${200 - G}" fill="url(#g-${uid})"/>`;
    front = Array.from({ length: 26 }, () => `<circle cx="${f(r() * 120)}" cy="${f(G + 6 + r() * 42)}" r="${f(1.2 + r() * 1.6)}" fill="${["#F277B0", "#B57BEF", "#FFE45C", "#fff"][Math.floor(r() * 4)]}"/>`).join("");
  } else if (s.k === "summer") {
    back = [["#FF6B6B", 72], ["#FFD84D", 67], ["#6BCB77", 62], ["#4D96FF", 57]].map(([c, rr]) =>
      `<path d="M ${60 - rr} ${G} A ${rr} ${rr} 0 0 1 ${60 + rr} ${G}" fill="none" stroke="${c}" stroke-width="4" opacity=".35"/>`).join("") +
      `<ellipse cx="20" cy="${G + 4}" rx="55" ry="22" fill="#2F9E4F"/><ellipse cx="100" cy="${G + 6}" rx="50" ry="18" fill="#3DB35F"/>`;
    ground = `<rect y="${G}" width="120" height="${200 - G}" fill="url(#g-${uid})"/>`;
    front = Array.from({ length: 7 }, (_, i) => { const x = 6 + i * 17 + r() * 6, y = G + 14 + r() * 26; return `<rect x="${f(x - 1)}" y="${f(y)}" width="2" height="6" fill="#6B4A2B"/><circle cx="${f(x)}" cy="${f(y - 3)}" r="${f(5 + r() * 2)}" fill="#1E7A3C"/>`; }).join("");
  } else if (s.k === "autumn") {
    back = `<polygon points="-5,${G} 44,86 74,120 96,100 125,${G}" fill="#5E6F96"/>
      <polygon points="44,86 58,102 50,104 40,98 32,104" fill="#FFF3E0"/>
      <polygon points="44,86 74,120 60,${G} 50,${G}" fill="#FF9A3C" opacity=".75"/>`;
    ground = `<rect y="${G}" width="120" height="${200 - G}" fill="url(#g-${uid})"/>
      <path d="M -5 ${G + 30} Q 40 ${G + 20} 70 ${G + 34} T 125 ${G + 30}" stroke="#4C8BDB" stroke-width="6" fill="none" opacity=".8"/>`;
    front = Array.from({ length: 9 }, () => { const x = r() * 120, y = G + 8 + r() * 36; return `<circle cx="${f(x)}" cy="${f(y)}" r="${f(3.5 + r() * 2.5)}" fill="${["#D7431F", "#F08A24", "#F7C04A", "#B8321A"][Math.floor(r() * 4)]}"/>`; }).join("");
  } else {
    back = `<polygon points="-5,${G} 18,108 44,130 70,100 100,126 125,112 125,${G}" fill="#8A9BB5"/>
      <polygon points="18,108 26,117 10,117" fill="#F4F8FC"/><polygon points="70,100 79,110 61,110" fill="#F4F8FC"/>`;
    ground = `<rect y="${G}" width="120" height="${200 - G}" fill="url(#g-${uid})"/>` +
      [[14, G + 22], [36, G + 30], [58, G + 20]].map(([x, y]) => `<rect x="${x}" y="${y}" width="14" height="10" fill="#6E7F99"/><polygon points="${x - 3},${y} ${x + 7},${y - 7} ${x + 17},${y}" fill="#fff"/><rect x="${x + 5}" y="${y + 4}" width="3" height="3" fill="#FFD76A"/>`).join("");
    front = Array.from({ length: 34 }, () => `<circle cx="${f(r() * 120)}" cy="${f(r() * 196)}" r="${f(0.7 + r() * 1.1)}" fill="#fff" opacity="${f(0.55 + r() * 0.4)}"/>`).join("");
  }
  const grounds = { spring: ["#D6EC86", "#F3D35A"], summer: ["#3FB060", "#237F3F"], autumn: ["#E8702E", "#F2A541"], winter: ["#F7FAFD", "#D9E4F1"] };
  const [sk1, sk2] = skies[s.k], [g1, g2] = grounds[s.k];
  return `<svg viewBox="0 0 120 200" role="img" aria-label="${s.name}: 남중 고도 ${s.alt}도, 햇빛이 닿는 땅의 넓이">
    <defs>
      <linearGradient id="s-${uid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${sk1}"/><stop offset="1" stop-color="${sk2}"/></linearGradient>
      <linearGradient id="g-${uid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${g1}"/><stop offset="1" stop-color="${g2}"/></linearGradient>
      <radialGradient id="h-${uid}"><stop offset="0" stop-color="#FFF6C8"/><stop offset=".5" stop-color="#FFD24A" stop-opacity=".7"/><stop offset="1" stop-color="#FFD24A" stop-opacity="0"/></radialGradient>
    </defs>
    <rect width="120" height="200" fill="url(#s-${uid})"/>
    ${back}${ground}${s.k === "winter" ? "" : front}
    <polygon points="${f(p1[0])},${f(p1[1])} ${f(e1[0])},${G} ${f(e2[0])},${G} ${f(p2[0])},${f(p2[1])}" fill="#FFE98A" opacity=".55"/>
    <rect x="${f(patchL)}" y="${G - 1.5}" width="${f(patchW)}" height="5" rx="2" fill="#FFE14D" opacity="${f(glow)}"/>
    <rect x="${f(patchL - 2)}" y="${G - 3}" width="${f(patchW + 4)}" height="8" rx="4" fill="#FFF2A8" opacity="${f(glow * 0.5)}"/>
    <polygon points="${stickX},${G} ${f(stickX + shadow)},${G} ${stickX},${G - 1.5}" fill="#1B2A41" opacity=".45"/>
    <line x1="${f(stickX + 0.5)}" y1="${G - stickH}" x2="${f(stickX + shadow)}" y2="${G}" stroke="#1B2A41" stroke-width="2.4" stroke-linecap="round" opacity=".55"/>
    <line x1="${stickX}" y1="${G}" x2="${stickX}" y2="${G - stickH}" stroke="#1B2A41" stroke-width="2" stroke-linecap="round"/>
    <circle cx="${f(sx)}" cy="${f(sy)}" r="${f(16 + glow * 10)}" fill="url(#h-${uid})"/>
    <circle cx="${f(sx)}" cy="${f(sy)}" r="9" fill="#FFC62E" stroke="#FFF3B0" stroke-width="2"/>
    ${s.k === "winter" ? front : ""}
  </svg>`;
}

// 네 계절 그림. compact=true 는 미션 지도 위쪽에 쓰는 작은 모양
function seasonsArt(compact) {
  return h("div", { class: "seasons" + (compact ? " compact" : "") }, SEASONS.map((s) => {
    const art = h("div", { html: seasonScene(s, (compact ? "c" : "h") + s.k) });
    const cap = compact
      ? h("div", { class: "cap" }, h("span", { class: "s-name" }, s.name), h("span", { class: "s-alt" }, s.alt + "°"))
      : h("div", { class: "cap" },
          h("span", { class: "s-name" }, s.name),
          h("span", { class: "s-alt" }, "남중 고도", h("b", {}, s.alt + "°")),
          h("span", { class: "s-day" }, "낮의 길이", h("b", {}, s.day)),
          h("span", { class: "s-heat", "aria-label": "햇빛 에너지 " + ["", "적음", "보통", "많음"][s.heat] }, "햇빛 " + "●".repeat(s.heat) + "○".repeat(3 - s.heat)));
    return h("div", { class: "season", "data-s": s.k }, art.firstElementChild, cap);
  }));
}

function missionBand(mid) {
  const k = MISSION_SEASON[mid] || "all";
  const s = SEASON_BY_K[k] || { name: "사계절", alt: 52 };
  const bottom = 12 + (s.alt / 90) * 34;
  const left = 10 + ((s.alt - 29) / (76 - 29)) * 26;
  return h("div", { class: "m-band", "data-s": k, "aria-hidden": "true" },
    h("span", { class: "sun", style: `bottom:${bottom.toFixed(0)}px;left:${left.toFixed(0)}%` }),
    h("span", { class: "ground" }),
    h("span", { class: "tag" }, k === "all" ? "사계절 정리" : `${s.name} · 남중 고도 ${s.alt}°`));
}

/* ---------------- 모둠원 ↔ 역할 선잇기 ---------------- */
// 4명 이상: 한 사람은 역할 하나 (역할 하나를 여러 명이 나눠 맡을 수 있어요)
// 4명 미만: 역할 하나는 한 사람 (한 사람이 역할 여러 개를 맡아요)
const ROLE_COLORS = ["#E8639A", "#E4472B", "#D9820F", "#2A6FBE"];
function roleMatcher(getNames, initial) {
  const NS = "http://www.w3.org/2000/svg";
  let links = (initial || []).slice();
  let picked = null, drag = null;
  const api = { onChange: () => {} };
  const svg = document.createElementNS(NS, "svg"); svg.setAttribute("class", "lines"); svg.setAttribute("aria-hidden", "true");
  const left = h("div", { class: "col left" });
  const right = h("div", { class: "col right" });
  const board = h("div", { class: "matcher" }, left, h("div"), right, svg);
  const status = h("p", { class: "match-status", role: "status" });
  const count = () => getNames().length;

  function normalize() {
    const n = count();
    links = links.filter(([k]) => k < n);
    if (n >= 4) { const seen = new Set(); links = links.filter(([k]) => (seen.has(k) ? false : seen.add(k))); }
    else { const seen = new Set(); links = links.reverse().filter(([, r]) => (seen.has(r) ? false : seen.add(r))).reverse(); }
  }
  function connect(k, r) {
    if (links.some(([a, b]) => a === k && b === r)) links = links.filter(([a, b]) => !(a === k && b === r));
    else {
      links = count() >= 4 ? links.filter(([a]) => a !== k) : links.filter(([, b]) => b !== r);
      links.push([k, r]);
    }
    picked = null; draw(); api.onChange();
  }
  function tap(side, i) {
    if (picked && picked.side !== side) return connect(side === "m" ? i : picked.i, side === "r" ? i : picked.i);
    picked = picked && picked.side === side && picked.i === i ? null : { side, i };
    draw();
  }
  function bindNode(node, side, i) {
    node.addEventListener("click", (e) => { if (e.detail === 0) tap(side, i); }); // 키보드
    node.addEventListener("pointerdown", (e) => {
      drag = { side, i, x0: e.clientX, y0: e.clientY, moved: false };
      node.setPointerCapture(e.pointerId);
    });
    node.addEventListener("pointermove", (e) => {
      if (!drag) return;
      if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) > 8) drag.moved = true;
      if (drag.moved) drawLines(e.clientX, e.clientY);
    });
    node.addEventListener("pointerup", (e) => {
      if (!drag) return;
      const d = drag; drag = null;
      if (!d.moved) return tap(side, i);
      const hit = document.elementFromPoint(e.clientX, e.clientY);
      const target = hit && hit.closest(".match-node");
      if (target && board.contains(target) && target.dataset.side !== side) {
        const j = +target.dataset.i;
        connect(side === "m" ? i : j, side === "r" ? i : j);
      } else draw();
    });
    node.addEventListener("pointercancel", () => { drag = null; draw(); });
  }
  function dotCenter(node) {
    const b = board.getBoundingClientRect(), d = node.querySelector(".dot").getBoundingClientRect();
    return [d.left + d.width / 2 - b.left, d.top + d.height / 2 - b.top];
  }
  function drawLines(px, py) {
    const b = board.getBoundingClientRect();
    let out = links.map(([k, r]) => {
      const m = left.children[k], ro = right.children[r];
      if (!m || !ro) return "";
      const [x1, y1] = dotCenter(m), [x2, y2] = dotCenter(ro);
      return `<path d="M ${x1} ${y1} C ${x1 + 40} ${y1}, ${x2 - 40} ${y2}, ${x2} ${y2}" stroke="${ROLE_COLORS[r]}" stroke-width="4" fill="none" stroke-linecap="round"/>`;
    }).join("");
    if (drag && drag.moved && px != null) {
      const node = (drag.side === "m" ? left : right).children[drag.i];
      const [x1, y1] = dotCenter(node);
      out += `<line x1="${x1}" y1="${y1}" x2="${px - b.left}" y2="${py - b.top}" stroke="#1B2A41" stroke-width="3" stroke-dasharray="6 5"/>`;
    }
    svg.innerHTML = out;
  }
  function draw() {
    normalize();
    const names = getNames();
    left.replaceChildren(...names.map((nm, k) => {
      const node = h("button", { type: "button", class: "match-node" + (nm ? "" : " empty-name"), "data-side": "m", "data-i": k,
        "aria-label": `${nm || "모둠원 " + (k + 1)} 선택` }, nm || "모둠원 " + (k + 1), h("span", { class: "dot" }));
      node.classList.toggle("picked", !!picked && picked.side === "m" && picked.i === k);
      node.classList.toggle("linked", links.some(([a]) => a === k));
      bindNode(node, "m", k);
      return node;
    }));
    right.replaceChildren(...ROLES.map((ro, r) => {
      const node = h("button", { type: "button", class: "match-node", "data-side": "r", "data-i": r, "data-r": r, "aria-label": ro.name + " 선택" },
        h("span", { class: "role-name" }, ro.name), h("span", { class: "role-job" }, ro.job), h("span", { class: "dot" }));
      node.classList.toggle("picked", !!picked && picked.side === "r" && picked.i === r);
      node.classList.toggle("linked", links.some(([, b]) => b === r));
      bindNode(node, "r", r);
      return node;
    }));
    const n = names.length;
    const loneM = names.map((nm, k) => k).filter((k) => !links.some(([a]) => a === k));
    const loneR = ROLES.map((_, r) => r).filter((r) => !links.some(([, b]) => b === r));
    const ok = !loneM.length && !loneR.length;
    status.className = "match-status" + (ok ? " ok" : "");
    status.textContent = ok ? "모두 이어졌어요! 미션마다 역할이 한 칸씩 돌아가요."
      : [loneM.length ? `선이 없는 모둠원 ${loneM.length}명` : "", loneR.length ? `맡은 사람이 없는 역할 ${loneR.length}개` : ""].filter(Boolean).join(" · ");
    requestAnimationFrame(() => drawLines());
  }
  api.value = () => {
    const n = count();
    const map = Array.from({ length: n }, (_, k) => links.filter(([a]) => a === k).map(([, r]) => r).sort());
    const ok = map.every((rs) => rs.length) && ROLES.every((_, r) => links.some(([, b]) => b === r));
    return ok ? map : null;
  };
  api.refresh = draw;
  api.clear = () => { links = []; picked = null; draw(); api.onChange(); };
  if (window.ResizeObserver) new ResizeObserver(() => drawLines()).observe(board);
  api.el = h("div", { class: "stack", style: "gap:8px" },
    h("p", { class: "match-help" }, n4help()), board,
    h("div", { class: "row", style: "justify-content:space-between" }, status,
      h("button", { type: "button", class: "chip", onclick: () => api.clear() }, "선 모두 지우기")));
  function n4help() { return "모둠원 이름을 누른 뒤 역할을 누르면 선이 이어져요. 끌어서 이어도 돼요. 이어진 둘을 다시 누르면 선이 지워져요."; }
  draw();
  return api;
}

function gaugeSVG(len, at, mode) {
  // 태양 고도 측정기: 막대 + 그림자 + 자(0~4 cm)
  const x0 = 40, base = 150, unit = 70, stickH = 60;
  let ticks = "";
  for (let i = 0; i <= 40; i++) {
    const x = x0 + (i / 10) * unit, big = i % 10 === 0, mid = i % 5 === 0;
    ticks += `<line x1="${x}" y1="${base + 8}" x2="${x}" y2="${base + 8 + (big ? 16 : mid ? 11 : 6)}" stroke="#1B2A41" stroke-width="${big ? 1.6 : 1}"/>`;
    if (big) ticks += `<text x="${x}" y="${base + 40}" text-anchor="middle" font-size="13" fill="#1B2A41" font-family="Pretendard Variable, Pretendard, sans-serif">${i / 10}</text>`;
  }
  let body = "";
  if (len != null) {
    const sx = x0 + len * unit;
    const ang = Math.atan2(stickH, len * unit);
    const deg = Math.round((ang * 180) / Math.PI);
    body = `
      <line x1="${sx + (x0 - sx) * 1.9}" y1="${base - stickH * 1.9}" x2="${sx}" y2="${base}" stroke="#F2A007" stroke-width="2" stroke-dasharray="5 4"/>
      <rect x="${x0}" y="${base - 3}" width="${len * unit}" height="6" fill="#1B2A41" opacity=".55"/>
      <line x1="${sx}" y1="${base - 14}" x2="${sx}" y2="${base + 8}" stroke="#D9482B" stroke-width="2"/>
      <text x="${Math.min(sx + 6, 300)}" y="${base - 18}" font-size="12" fill="#D9482B" font-family="Pretendard Variable, Pretendard, sans-serif">그림자 끝</text>
      <text x="16" y="24" font-size="15" fill="#1B2A41" font-family="Pretendard Variable, Pretendard, sans-serif" font-weight="700">${at} 위치 · ${mode === "tilted" ? "기울어짐" : "수직"}</text>
      <text x="16" y="44" font-size="13" fill="#4F6079" font-family="Pretendard Variable, Pretendard, sans-serif">태양 고도 약 ${deg}° (막대 높이 기준)</text>`;
  } else {
    body = `<text x="16" y="30" font-size="15" fill="#4F6079" font-family="Pretendard Variable, Pretendard, sans-serif">왼쪽 그림에서 가·나·다·라 중 하나를 누르세요.</text>`;
  }
  return `<svg viewBox="0 0 360 200" role="img" aria-label="태양 고도 측정기와 자">
    <rect x="${x0 - 10}" y="${base + 6}" width="${4 * unit + 20}" height="36" rx="4" fill="#FFF1CF" stroke="#F2A007"/>
    ${ticks}
    <line x1="${x0 - 14}" y1="${base}" x2="${x0 + 4 * unit + 14}" y2="${base}" stroke="#4F6079" stroke-width="1.5"/>
    <rect x="${x0 - 3}" y="${base - stickH}" width="6" height="${stickH}" fill="#1B2A41"/>
    ${body}
    <text x="${x0 + 4 * unit + 6}" y="${base + 40}" font-size="12" fill="#4F6079" font-family="Pretendard Variable, Pretendard, sans-serif">cm</text>
  </svg>`;
}

/* ---------------- 선생님 설정 (이 기기에만 저장) ---------------- */
document.getElementById("teacherBtn").addEventListener("click", () => {
  const code = h("input", { id: "tAuth", type: "password", inputmode: "numeric", placeholder: "선생님 코드" });
  const msg = h("p", { class: "small", style: "margin:0;color:var(--summer)" });
  const body = h("div", { class: "stack" });
  const close = () => wrap.remove();
  const unlock = () => {
    if (code.value.trim() !== String(D.settings.code)) { msg.textContent = "코드가 맞지 않아요."; return; }
    const c = h("input", { id: "tCode", value: D.settings.code });
    const l = h("input", { id: "tLock", type: "number", min: 0, max: 60, value: D.settings.lockSec });
    const r = h("input", { id: "tRead", type: "number", min: 0, max: 120, value: D.settings.readSec });
    const multi = D.mode === "multi";
    body.replaceChildren(
      h("div", { class: "field" }, h("label", { for: "tCode" }, "관문 통과 코드 (미션 4)"), c),
      h("div", { class: "field" }, h("label", { for: "tLock" }, "오답 잠금 시간(초)"), l),
      h("div", { class: "field" }, h("label", { for: "tRead" }, "미션 시작 전 읽기 시간(초)"), r),
      h("div", { class: "row" },
        h("button", { class: "btn", type: "button", onclick: () => {
          D.settings = { code: c.value.trim() || DEFAULTS.code, lockSec: Math.max(0, +l.value || 0), readSec: Math.max(0, +r.value || 0) }; saveDevice(); close();
        } }, "저장"),
        D.mode ? h("button", { class: "btn line", type: "button", onclick: () => {
          body.replaceChildren(
            h("p", {}, multi ? "이 패드를 모둠에서 빼고 처음 화면으로 돌아갈까요? 모둠 기록은 그대로 남아요."
              : "이 기기의 모둠 기록을 모두 지우고 처음 화면으로 돌아갈까요?"),
            h("div", { class: "row" },
              h("button", { class: "btn", type: "button", style: "background:var(--summer)", onclick: () => { leaveTeam(!multi); close(); } },
                multi ? "이 패드 나가기" : "처음부터 다시"),
              h("button", { class: "btn line", type: "button", onclick: close }, "취소")));
        } }, multi ? "이 패드 나가기" : "모둠 기록 초기화") : null,
        h("button", { class: "btn line", type: "button", onclick: close }, "닫기")),
      h("p", { class: "small muted", style: "margin:0" }, "여기 설정은 이 기기에만 저장돼요. 각자 패드로 할 때는 오답 잠금 시간은 확인 대장 패드의 설정, 읽기 시간은 각 패드의 설정을 따라요."));
  };
  body.append(
    h("p", { style: "margin:0" }, "선생님 코드를 입력하세요. (처음 코드: 2350)"),
    h("div", { class: "field" }, code), msg,
    h("div", { class: "row" }, h("button", { class: "btn", type: "button", onclick: unlock }, "열기"), h("button", { class: "btn line", type: "button", onclick: close }, "닫기")));
  const wrap = h("div", { class: "teacher" }, h("div", { class: "panel stack" }, h("h2", { style: "font-size:24px" }, "선생님 설정"), body));
  document.body.append(wrap);
  code.focus();
});

/* ---------------- 부팅 ---------------- */
if (D.mode && (D.mode === "solo" ? D.soloT : D.tid)) openTeam();
else { D.mode = null; saveDevice(); schedule(); }
</script>
